<VirtualHost *:80>
    ServerName arobaskaraesa.com
    ServerAlias www.arobaskaraesa.com abe-group.id www.abe-group.id
    
    # Path to the public directory of your Laravel application
    DocumentRoot /var/www/compro_aro/public

    <Directory /var/www/compro_aro/public>
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    # Log files configuration
    ErrorLog ${APACHE_LOG_DIR}/compro_aro_error.log
    CustomLog ${APACHE_LOG_DIR}/compro_aro_access.log combined

    # Security: Disable file listing
    <Files ~ "^\.env">
        Order allow,deny
        Deny from all
    </Files>
</VirtualHost>
